<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@700;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sarabun', 'Segoe UI', Tahoma, sans-serif;
    background: #0f0f0f;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }

  .logo {
    font-family: 'Kanit', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  .logo span { color: #25f4ee; }
  .logo span.pink { color: #fe2c55; }

  .subtitle {
    font-size: 14px;
    color: #aaa;
    margin-bottom: 36px;
  }

  .card {
    background: #1c1c1c;
    border: 1px solid #2a2a2a;
    border-radius: 16px;
    padding: 28px;
    width: 100%;
    max-width: 520px;
    margin-bottom: 20px;
  }

  .drop-zone {
    border: 2px dashed #3a3a3a;
    border-radius: 12px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #25f4ee;
    background: rgba(37, 244, 238, 0.05);
  }
  .drop-icon { font-size: 48px; margin-bottom: 12px; }
  .drop-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .drop-sub { font-size: 13px; color: #888; }

  #file-input { display: none; }

  .btn {
    display: inline-block;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: 0.2s;
  }
  .btn-primary {
    background: #25f4ee;
    color: #0f0f0f;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    margin-top: 16px;
    border-radius: 10px;
  }
  .btn-primary:hover { background: #1dd6d0; }
  .btn-primary:disabled {
    background: #2a2a2a;
    color: #555;
    cursor: not-allowed;
  }

  .btn-download {
    background: #fe2c55;
    color: #fff;
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 10px;
    margin-top: 8px;
  }
  .btn-download:hover { background: #e0243d; }

  .result-box {
    display: none;
    background: #111;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
  }
  .result-box.show { display: block; }

  .result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #222;
    font-size: 15px;
  }
  .result-row:last-child { border-bottom: none; }
  .result-label { color: #aaa; }
  .result-value { font-weight: 700; font-size: 16px; }
  .result-value.green { color: #25f4ee; }
  .result-value.pink { color: #fe2c55; font-size: 20px; }

  .badge {
    display: inline-block;
    background: #1e3a2f;
    color: #25f4ee;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 6px;
  }

  .rule-box {
    background: #161616;
    border: 1px solid #222;
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13px;
    color: #777;
    margin-top: 16px;
    line-height: 1.7;
  }
  .rule-box b { color: #aaa; }

  .status-bar {
    font-size: 13px;
    color: #888;
    text-align: center;
    padding: 8px;
    min-height: 28px;
  }
  .status-bar.ok { color: #25f4ee; }
  .status-bar.err { color: #fe2c55; }

  .filename-tag {
    background: #222;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    color: #ccc;
    margin-top: 12px;
    display: none;
    word-break: break-all;
  }
  .filename-tag.show { display: block; }
</style>
</head>
<body>

<div class="logo">garli<span>con</span><span class="pink">line</span></div>
<div class="subtitle">คำนวณค่าคอม Creator ไลฟ์ · 6% ของรายได้รวม</div>

<div class="card">
  <!-- Drop zone -->
  <div class="drop-zone" id="drop-zone">
    <div class="drop-icon">📂</div>
    <div class="drop-title">ลากไฟล์ Excel มาวางที่นี่</div>
    <div class="drop-sub">หรือคลิกเพื่อเลือกไฟล์ · รองรับ .xlsx</div>
    <input type="file" id="file-input" accept=".xlsx,.xls">
  </div>

  <div class="filename-tag" id="filename-tag"></div>

  <div class="rule-box">
    <b>Filter อัตโนมัติ:</b><br>
    ค่าคอมแอฟฟิลิเอต (AA) = 0 &nbsp;·&nbsp;
    คูปองไลฟ์คุ้ม (AM) ≠ 0 &nbsp;·&nbsp;
    รายได้รวม (G) &gt; 0
  </div>

  <button class="btn btn-primary" id="btn-process" disabled>คำนวณค่าคอม</button>

  <div class="status-bar" id="status"></div>

  <!-- Result -->
  <div class="result-box" id="result-box">
    <div class="result-row">
      <span class="result-label">Row ที่ผ่าน filter</span>
      <span class="result-value green" id="r-rows">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">รายได้รวม (G)</span>
      <span class="result-value green" id="r-total">—</span>
    </div>
    <div class="result-row">
      <span class="result-label">ค่าคอม 6% <span class="badge">จ่ายทุก 7 วัน</span></span>
      <span class="result-value pink" id="r-comm">—</span>
    </div>
    <button class="btn btn-download" id="btn-download">⬇ ดาวน์โหลด Excel</button>
  </div>
</div>

<script>
let workbookOut = null;
let outFilename = '';

const dropZone   = document.getElementById('drop-zone');
const fileInput  = document.getElementById('file-input');
const btnProcess = document.getElementById('btn-process');
const btnDl      = document.getElementById('btn-download');
const statusEl   = document.getElementById('status');
const resultBox  = document.getElementById('result-box');
const fnTag      = document.getElementById('filename-tag');

// Drag & drop
dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('dragover');
  const f = e.dataTransfer.files[0];
  if (f) loadFile(f);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files[0]) loadFile(fileInput.files[0]);
});

let rawFile = null;
function loadFile(f) {
  rawFile = f;
  fnTag.textContent = '📄 ' + f.name;
  fnTag.classList.add('show');
  btnProcess.disabled = false;
  resultBox.classList.remove('show');
  workbookOut = null;
  setStatus('');
}

function toNum(val) {
  if (val === null || val === undefined || val === '') return 0;
  if (typeof val === 'number') return val;
  return parseFloat(String(val).replace(/,/g, '').trim()) || 0;
}

function fmt(n) {
  return '฿' + n.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function setStatus(msg, type = '') {
  statusEl.textContent = msg;
  statusEl.className = 'status-bar' + (type ? ' ' + type : '');
}

btnProcess.addEventListener('click', () => {
  if (!rawFile) return;
  setStatus('กำลังอ่านไฟล์...');
  btnProcess.disabled = true;

  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, { type: 'array', cellText: false });
      const ws = wb.Sheets[wb.SheetNames[0]];
      // Use header:'A' so rows are objects keyed by Excel column letter (A,B,...,AA,AM)
      // This avoids sparse-array issues with numeric index approach
      const rows = XLSX.utils.sheet_to_json(ws, { header: 'A', defval: '', raw: true });

      if (rows.length < 2) { setStatus('ไม่มีข้อมูลในไฟล์', 'err'); btnProcess.disabled = false; return; }

      const COLS = ['A','B','C','D','E','F','G','AA','AM'];
      const hdrRow = rows[0];
      const outHeader = COLS.map(k => hdrRow[k] || k);

      // Filter: AA=0, AM≠0, G>0
      const filtered = [];
      for (let i = 1; i < rows.length; i++) {
        const row = rows[i];
        const aa = toNum(row['AA']);
        const am = toNum(row['AM']);
        const g  = toNum(row['G']);
        if (aa === 0 && am !== 0 && g > 0) {
          filtered.push(COLS.map(k => row[k]));
        }
      }

      if (filtered.length === 0) { setStatus('ไม่มี row ที่ผ่าน filter', 'err'); btnProcess.disabled = false; return; }

      const totalG = filtered.reduce((s, r) => s + toNum(r[6]), 0);
      const comm   = totalG * 0.06;

      // Build output worksheet data
      const outData = [];
      outData.push(outHeader);
      filtered.forEach(r => outData.push(r));

      const lastDataRow = outData.length; // 1-based: will be row lastDataRow in sheet

      // SUBTOTAL row
      outData.push(['รายได้รวม (SUBTOTAL)', '', '', '', '', '', totalG, '', '']);
      const subtotalRowIdx = outData.length;

      // 6% row
      outData.push(['ค่าคอม 6%', '', '', '', '', '', comm, '', '']);
      const commRowIdx = outData.length;

      // Create worksheet
      const wsOut = XLSX.utils.aoa_to_sheet(outData);

      // Style helpers
      const yellow = { fgColor: { rgb: 'FFD700' } };
      const green  = { fgColor: { rgb: '2d9e5f' } };
      const hdr    = { fgColor: { rgb: '1a6b3c' } };

      function cellRef(r, c) { return XLSX.utils.encode_cell({ r, c }); }

      // Header row (row 0)
      for (let c = 0; c < 9; c++) {
        const ref = cellRef(0, c);
        if (!wsOut[ref]) wsOut[ref] = {};
        wsOut[ref].s = { fill: { patternType: 'solid', ...hdr }, font: { bold: true, color: { rgb: 'FFFFFF' } } };
      }

      // SUBTOTAL row
      const sr = subtotalRowIdx - 1;
      for (let c = 0; c < 9; c++) {
        const ref = cellRef(sr, c);
        if (!wsOut[ref]) wsOut[ref] = { t: 'z', v: '' };
        wsOut[ref].s = { fill: { patternType: 'solid', ...yellow }, font: { bold: true } };
      }
      wsOut[cellRef(sr, 6)].z = '#,##0.00';

      // Commission row
      const cr = commRowIdx - 1;
      for (let c = 0; c < 9; c++) {
        const ref = cellRef(cr, c);
        if (!wsOut[ref]) wsOut[ref] = { t: 'z', v: '' };
        wsOut[ref].s = { fill: { patternType: 'solid', ...green }, font: { bold: true, color: { rgb: 'FFFFFF' } } };
      }
      wsOut[cellRef(cr, 6)].z = '#,##0.00';

      // Number format for col G data rows
      for (let r = 1; r <= lastDataRow - 1; r++) {
        const ref = cellRef(r, 6);
        if (wsOut[ref]) wsOut[ref].z = '#,##0.00';
      }

      const wbOut = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wbOut, wsOut, 'income');

      workbookOut = wbOut;
      outFilename = rawFile.name.replace(/\.xlsx?$/i, '') + '_processed.xlsx';

      // Update UI
      document.getElementById('r-rows').textContent  = filtered.length.toLocaleString() + ' rows';
      document.getElementById('r-total').textContent = fmt(totalG);
      document.getElementById('r-comm').textContent  = fmt(comm);
      resultBox.classList.add('show');
      setStatus('คำนวณสำเร็จ ✓', 'ok');
    } catch (err) {
      setStatus('เกิดข้อผิดพลาด: ' + err.message, 'err');
    }
    btnProcess.disabled = false;
  };
  reader.readAsArrayBuffer(rawFile);
});

btnDl.addEventListener('click', () => {
  if (!workbookOut) return;
  XLSX.writeFile(workbookOut, outFilename, { bookSST: false, cellStyles: true });
});
</script>
</body>
</html>
